<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>网页合集</title>
<meta name="description" content="一些单页小作品，点开就能看。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 -3 16 16' shape-rendering='crispEdges'><g fill='%23d97757'><rect x='3' y='0' width='10' height='1'/><rect x='2' y='1' width='12' height='7'/><rect x='0' y='4' width='2' height='2'/><rect x='14' y='4' width='2' height='2'/><rect x='3' y='8' width='1' height='2'/><rect x='5' y='8' width='1' height='2'/><rect x='9' y='8' width='1' height='2'/><rect x='11' y='8' width='1' height='2'/></g><g fill='%2318152b'><rect x='5' y='3' width='1' height='2'/><rect x='10' y='3' width='1' height='2'/></g></svg>">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f4f1f8">
<style>
/* 和手册同一套底色和墨色；目录页只用系统字体，保持只有几 KB */
:root{--bg:#f4f1f8;--ink:#18152b;--ink-2:#423c5d;--ink-3:#655d86;--line:rgba(24,21,43,.16);--accent:#b8336f;--sel:#12738e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15122a;--ink:#efebf9;--ink-2:#c4bddc;--ink-3:#a49dbf;--line:rgba(238,234,248,.18);--accent:#f27cb3;--sel:#5cc4de;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-block:clamp(48px,10vw,104px) 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:14px}
.top svg{width:44px;flex:none;shape-rendering:crispEdges}
h1{margin:0;font-size:clamp(30px,6vw,44px);line-height:1.2;font-weight:900;letter-spacing:-.01em}
.lead{margin:10px 0 clamp(32px,6vw,48px);color:var(--ink-2)}
ol{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
li a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:18px 0 20px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
li b{font-size:20px;line-height:1.45;font-weight:900;transition:color .2s}
li .d{grid-column:1;color:var(--ink-2);font-size:15.5px}
li .m{grid-column:1;color:var(--ink-3);font-size:13.5px}
li i{grid-row:1/4;grid-column:2;align-self:center;font-style:normal;color:var(--ink-3);transition:transform .2s,color .2s}
@media (hover:hover){li a:hover b,li a:hover i{color:var(--accent)}li a:hover i{transform:translateX(3px)}}
a:focus-visible{outline:2px solid var(--sel);outline-offset:4px}
footer{margin-top:36px;color:var(--ink-3);font-size:13.5px}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <svg viewBox="0 -1 16 11" aria-hidden="true"><g fill="#d97757"><rect x="3" y="0" width="10" height="1"/><rect x="2" y="1" width="12" height="7"/><rect x="0" y="4" width="2" height="2"/><rect x="14" y="4" width="2" height="2"/><rect x="3" y="8" width="1" height="2"/><rect x="5" y="8" width="1" height="2"/><rect x="9" y="8" width="1" height="2"/><rect x="11" y="8" width="1" height="2"/></g><rect x="2" y="7" width="12" height="1" fill="#a8553a"/><rect x="3" y="1" width="3" height="1" fill="#f2a585"/><g fill="#18152b"><rect x="5" y="3" width="1" height="2"/><rect x="10" y="3" width="1" height="2"/></g></svg>
    <h1>网页合集</h1>
  </div>
  <p class="lead">一些单页小作品，点开就能看，手机上也行。</p>
  <ol>
    <li><a href="ai-handbook/"><b>年轻人的第一份 AI 智能体手册</b><span class="d">给国内年轻人的 AI 智能体入门：它能替你做什么、怎么交代、怎么验收。</span><span class="m">手册 · 2026 年 11 月 · 约 20 分钟</span><i aria-hidden="true">→</i></a></li>
  </ol>
  <footer>这些页面由 AI（Claude）搭建，经人工审核。</footer>
</main>
</body>
</html>
